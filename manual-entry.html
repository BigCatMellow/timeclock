<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manual student check-in and check-out entry">
  <title>Manual Student Time Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #214289;
      --gold: #f7ad4c;
      --green: #4caf50;
      --green-dark: #3a8f3e;
      --red: #e53935;
      --red-dark: #c62828;
      --bg: #f4f5f7;
      --white: #ffffff;
      --border: #d8dce3;
      --text: #1a1a1a;
      --muted: #777;
      --radius: 0.65rem;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }

    .header {
      min-height: 5rem;
      padding: 0.55rem 1.25rem;
      background: var(--blue);
      border-bottom: 5px solid var(--gold);
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo { height: 4rem; width: auto; flex-shrink: 0; }
    .title-wrap { color: white; }
    .title { margin: 0; font-size: 1.85rem; font-weight: 900; line-height: 1.05; }
    .subtitle { margin: 0.2rem 0 0; font-size: 0.95rem; opacity: 0.8; font-weight: 600; }

    .page {
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 22rem;
      gap: 1rem;
      align-items: start;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 0.2rem 0.8rem rgba(0,0,0,0.06);
    }

    .controls { padding: 1rem; margin-bottom: 1rem; }
    .control-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .field label {
      display: block;
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
      color: var(--blue);
    }

    .field input {
      width: 100%;
      min-height: 3.25rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      outline: none;
      background: white;
    }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(247,173,76,.2); }

    .mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
    .mode-btn {
      border: 0;
      border-radius: var(--radius);
      min-height: 3.4rem;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      color: #555;
      background: #eceff3;
      transition: .15s ease;
    }
    .mode-btn[data-mode="in"].active { background: var(--green-dark); color: white; }
    .mode-btn[data-mode="out"].active { background: var(--red-dark); color: white; }

    .search-card { overflow: hidden; }
    .search-top { padding: 1rem; border-bottom: 1px solid var(--border); }
    .search-label { display: block; font-size: 1.15rem; font-weight: 900; color: var(--blue); margin-bottom: .35rem; }
    .search-box {
      width: 100%;
      padding: .7rem .85rem;
      border: 3px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      font-size: 1.55rem;
      font-weight: 700;
    }
    .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(247,173,76,.2); }

    .results {
      max-height: 56vh;
      overflow-y: auto;
      padding: .5rem;
    }
    .prompt, .no-results { text-align: center; padding: 2.4rem 1rem; color: var(--muted); font-weight: 700; }
    .student-row {
      width: 100%;
      border: 2px solid transparent;
      background: var(--bg);
      border-radius: var(--radius);
      padding: .8rem 1rem;
      margin-bottom: .45rem;
      cursor: pointer;
      text-align: left;
      font-size: 1.3rem;
      font-weight: 800;
      transition: .12s ease;
    }
    .student-row:hover { border-color: var(--blue); }
    .student-row.selected.in { background: #e7f5e8; border-color: var(--green-dark); }
    .student-row.selected.out { background: #fdebea; border-color: var(--red-dark); }

    .side { position: sticky; top: 6rem; overflow: hidden; }
    .side-head { padding: .9rem 1rem; border-bottom: 1px solid var(--border); }
    .count { margin: 0; font-size: 1.4rem; font-weight: 900; color: var(--blue); }
    .count small { font-size: .85rem; color: var(--muted); font-weight: 700; }

    .selected-list {
      max-height: 51vh;
      overflow-y: auto;
      padding: .6rem;
    }
    .empty-selected { text-align: center; color: var(--muted); padding: 1.4rem .5rem; font-weight: 700; }
    .selected-item {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .55rem .65rem;
      background: var(--bg);
      border-radius: .5rem;
      margin-bottom: .4rem;
      font-weight: 700;
    }
    .selected-name { flex: 1; min-width: 0; }
    .remove-btn {
      width: 2rem; height: 2rem; flex: 0 0 2rem;
      border: 0; border-radius: 50%; cursor: pointer;
      background: #e1e4e9; color: #555; font-size: 1.25rem; font-weight: 900;
    }

    .actions { padding: .75rem; border-top: 1px solid var(--border); }
    .submit-btn {
      width: 100%;
      min-height: 3.8rem;
      border: 0;
      border-radius: var(--radius);
      color: white;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      background: var(--green-dark);
    }
    .submit-btn.out { background: var(--red-dark); }
    .submit-btn:disabled { opacity: .35; cursor: not-allowed; }
    .clear-btn {
      width: 100%;
      min-height: 2.7rem;
      margin-top: .5rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: white;
      font-weight: 800;
      cursor: pointer;
    }

    .notification {
      position: fixed;
      left: 50%; bottom: 1.2rem;
      transform: translateX(-50%) translateY(2rem);
      min-width: min(32rem, calc(100vw - 2rem));
      padding: .9rem 1.1rem;
      border-radius: var(--radius);
      color: white;
      background: var(--green-dark);
      text-align: center;
      font-weight: 800;
      opacity: 0;
      visibility: hidden;
      transition: .2s ease;
      z-index: 100;
      box-shadow: 0 .4rem 1.5rem rgba(0,0,0,.25);
    }
    .notification.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .notification.error { background: var(--red-dark); }

    .loading {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,.58);
    }
    .loading.show { display: flex; }
    .loading-box { background: white; padding: 1.5rem 2rem; border-radius: var(--radius); text-align: center; font-weight: 800; }
    .spinner { width: 2.6rem; height: 2.6rem; margin: 0 auto .75rem; border: 4px solid #e6e6e6; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
      .side { position: static; }
      .selected-list { max-height: 30vh; }
      .results { max-height: 45vh; }
    }

    @media (max-width: 520px) {
      .title { font-size: 1.35rem; }
      .subtitle { display: none; }
      .logo { height: 3.2rem; }
      .header { min-height: 4.3rem; }
      .control-grid { grid-template-columns: 1fr; }
      .search-box { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <img class="logo" src="data:image/png;base64,<?= logoBytes ?>" alt="School Logo">
    <div class="title-wrap">
      <h1 class="title">Manual Student Time Entry</h1>
      <p class="subtitle">Select students, set the actual time, and submit the group.</p>
    </div>
  </header>

  <main class="page">
    <section>
      <div class="card controls">
        <div class="control-grid">
          <div class="field">
            <label for="entryDate">Date</label>
            <input id="entryDate" type="date">
          </div>
          <div class="field">
            <label for="entryTime">Time</label>
            <input id="entryTime" type="time">
          </div>
        </div>
        <div class="mode-row" aria-label="Entry status">
          <button class="mode-btn active" data-mode="in">Check In</button>
          <button class="mode-btn" data-mode="out">Check Out</button>
        </div>
      </div>

      <div class="card search-card">
        <div class="search-top">
          <label class="search-label" for="searchBox">Search Students</label>
          <input id="searchBox" class="search-box" type="search" placeholder="Start typing a student's name..." autocomplete="off">
        </div>
        <div id="results" class="results">
          <div class="prompt">Start typing a student name above.</div>
        </div>
      </div>
    </section>

    <aside class="card side">
      <div class="side-head">
        <p class="count"><span id="selectedCount">0</span> Selected <small>no limit</small></p>
      </div>
      <div id="selectedList" class="selected-list">
        <div class="empty-selected">No students selected yet.</div>
      </div>
      <div class="actions">
        <button id="submitBtn" class="submit-btn" disabled>Submit 0 Students</button>
        <button id="clearBtn" class="clear-btn" disabled>Clear Selection</button>
      </div>
    </aside>
  </main>

  <div id="notification" class="notification"></div>
  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loadingText">Saving entries...</div>
    </div>
  </div>

  <script>
    var state = {
      allStudents: [],
      filteredStudents: [],
      selectedStudents: new Map(),
      mode: 'in',
      submitting: false
    };

    var el = {
      date: document.getElementById('entryDate'),
      time: document.getElementById('entryTime'),
      search: document.getElementById('searchBox'),
      results: document.getElementById('results'),
      selectedList: document.getElementById('selectedList'),
      selectedCount: document.getElementById('selectedCount'),
      submit: document.getElementById('submitBtn'),
      clear: document.getElementById('clearBtn'),
      notification: document.getElementById('notification'),
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loadingText')
    };

    function init() {
      setDefaults();
      bindEvents();
      loadStudents();
    }

    function setDefaults() {
      var now = new Date();
      var local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      el.date.value = local.toISOString().slice(0, 10);
      el.time.value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    function bindEvents() {
      document.querySelectorAll('.mode-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          state.mode = btn.dataset.mode;
          document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          el.submit.classList.toggle('out', state.mode === 'out');
          renderResults();
        });
      });

      var searchTimer;
      el.search.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(handleSearch, 180);
      });

      el.results.addEventListener('click', function(e) {
        var row = e.target.closest('.student-row');
        if (!row) return;
        toggleStudent(row.dataset.id);
      });

      el.selectedList.addEventListener('click', function(e) {
        var btn = e.target.closest('.remove-btn');
        if (!btn) return;
        state.selectedStudents.delete(btn.dataset.key);
        renderSelection();
        renderResults();
      });

      el.clear.addEventListener('click', function() {
        state.selectedStudents.clear();
        renderSelection();
        renderResults();
        el.search.focus();
      });

      el.submit.addEventListener('click', submitEntries);
      el.date.addEventListener('change', updateSubmitState);
      el.time.addEventListener('change', updateSubmitState);
    }

    function loadStudents() {
      showLoading('Loading students...');
      google.script.run
        .withSuccessHandler(function(students) {
          state.allStudents = students || [];
          hideLoading();
          el.search.focus();
        })
        .withFailureHandler(function(error) {
          hideLoading();
          showNotification('Failed to load students: ' + getErrorMessage(error), true);
        })
        .getAllStudents();
    }

    function handleSearch() {
      var term = el.search.value.trim().toLowerCase();
      if (!term) {
        state.filteredStudents = [];
        el.results.innerHTML = '<div class="prompt">Start typing a student name above.</div>';
        return;
      }

      var words = term.split(/\s+/);
      state.filteredStudents = state.allStudents.filter(function(student) {
        var targets = [
          student.fullName || '',
          student.nickname || '',
          student.firstName || '',
          student.lastName || ''
        ].map(function(value) { return value.toLowerCase(); });

        return words.every(function(word) {
          return targets.some(function(target) { return target.indexOf(word) !== -1; });
        });
      });

      renderResults();
    }

    function renderResults() {
      if (!el.search.value.trim()) return;
      if (!state.filteredStudents.length) {
        el.results.innerHTML = '<div class="no-results">No matching students found.</div>';
        return;
      }

      el.results.innerHTML = state.filteredStudents.map(function(student) {
        var key = 'id:' + student.studentId;
        var selected = state.selectedStudents.has(key);
        var nickname = student.nickname && student.nickname !== '-' && student.nickname !== student.firstName
          ? ' (' + escapeHtml(student.nickname) + ')' : '';

        return '<button type="button" class="student-row' +
          (selected ? ' selected ' + state.mode : '') +
          '" data-id="' + escapeAttr(student.studentId) + '">' +
          escapeHtml(student.fullName) + nickname +
          (selected ? ' ✓' : '') +
          '</button>';
      }).join('');
    }

    function toggleStudent(studentId) {
      var key = 'id:' + studentId;
      if (state.selectedStudents.has(key)) {
        state.selectedStudents.delete(key);
      } else {
        var student = state.allStudents.find(function(item) {
          return String(item.studentId) === String(studentId);
        });
        if (!student) return;
        state.selectedStudents.set(key, {
          studentId: String(student.studentId),
          fullName: student.fullName
        });
      }

      renderSelection();
      renderResults();
      el.search.focus();
    }

    function renderSelection() {
      var selections = Array.from(state.selectedStudents.entries());
      el.selectedCount.textContent = selections.length;

      if (!selections.length) {
        el.selectedList.innerHTML = '<div class="empty-selected">No students selected yet.</div>';
      } else {
        el.selectedList.innerHTML = selections.map(function(entry) {
          var key = entry[0];
          var student = entry[1];
          return '<div class="selected-item">' +
            '<div class="selected-name">' + escapeHtml(student.fullName) + '</div>' +
            '<button type="button" class="remove-btn" data-key="' + escapeAttr(key) +
            '" aria-label="Remove ' + escapeAttr(student.fullName) + '">&times;</button>' +
            '</div>';
        }).join('');
      }

      el.submit.textContent = 'Submit ' + selections.length + ' Student' + (selections.length === 1 ? '' : 's');
      el.clear.disabled = selections.length === 0 || state.submitting;
      updateSubmitState();
    }

    function updateSubmitState() {
      el.submit.disabled = state.submitting ||
        state.selectedStudents.size === 0 ||
        !el.date.value ||
        !el.time.value;
    }

    function submitEntries() {
      if (state.submitting || el.submit.disabled) return;

      var selections = Array.from(state.selectedStudents.values());
      var names = selections.map(function(student) { return student.fullName; });
      var verb = state.mode === 'in' ? 'check in' : 'check out';
      var confirmed = window.confirm(
        'Manually ' + verb + ' ' + names.length + ' student' + (names.length === 1 ? '' : 's') +
        ' on ' + el.date.value + ' at ' + formatTimeForDisplay(el.time.value) + '?'
      );
      if (!confirmed) return;

      state.submitting = true;
      renderSelection();
      showLoading('Saving ' + names.length + ' student' + (names.length === 1 ? '' : 's') + '...');

      google.script.run
        .withSuccessHandler(function(result) {
          state.submitting = false;
          hideLoading();
          var count = result && result.count ? result.count : names.length;
          showNotification('Saved ' + count + ' manual entr' + (count === 1 ? 'y' : 'ies') + '.');
          state.selectedStudents.clear();
          el.search.value = '';
          state.filteredStudents = [];
          el.results.innerHTML = '<div class="prompt">Start typing a student name above.</div>';
          renderSelection();
          el.search.focus();
        })
        .withFailureHandler(function(error) {
          state.submitting = false;
          hideLoading();
          renderSelection();
          showNotification('Failed to save entries: ' + getErrorMessage(error), true);
        })
        .logManualCheckInOut(
          state.mode === 'in' ? 'In' : 'Out',
          el.date.value,
          el.time.value,
          selections
        );
    }

    function formatTimeForDisplay(value) {
      var parts = String(value || '').split(':');
      if (parts.length !== 2) return value;
      var hour = Number(parts[0]);
      var minute = parts[1];
      var suffix = hour >= 12 ? 'PM' : 'AM';
      var hour12 = hour % 12 || 12;
      return hour12 + ':' + minute + ' ' + suffix;
    }

    function showLoading(text) {
      el.loadingText.textContent = text || 'Working...';
      el.loading.classList.add('show');
    }

    function hideLoading() { el.loading.classList.remove('show'); }

    function showNotification(message, isError) {
      el.notification.textContent = message;
      el.notification.className = 'notification' + (isError ? ' error' : '');
      requestAnimationFrame(function() { el.notification.classList.add('show'); });
      setTimeout(function() { el.notification.classList.remove('show'); }, 4500);
    }

    function getErrorMessage(error) {
      return error && error.message ? error.message : String(error || 'Unknown error');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(value) { return escapeHtml(value); }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
